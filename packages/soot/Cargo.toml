[package]
name = "dirtybase_soot"
version.workspace = true
edition.workspace = true

[features]
default = ["extension"]
# Soot as a dirtybase extension: `dirtybase_entry::Extension`, the `[soot]`
# config, the `Soot` context resource and the `soot` CLI command. Without it
# soot is a standalone framework and depends on nothing but `dirtybase_db`.
extension = ["dirtybase_contract"]
# Exposes `SootMigration`, a `dirtybase_contract::db_contract::migration::Migration`
# implementation that creates/drops every table declared by a `Domain`. It is
# also registered by `Extension::migrations`, so turning this on is what makes
# `migrate up` create a domain's tables.
migrations = ["dirtybase_contract", "extension"]

[dependencies]
dirtybase_common = { workspace = true }
dirtybase_db = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
cruet = { workspace = true }

dirtybase_contract = { workspace = true, optional = true }
