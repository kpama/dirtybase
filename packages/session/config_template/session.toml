# Storage driver
storage = "memory" # options: dummy, database, file, memory, redis

# use the follow entry for a customer driver
# note: you will need to comment out the entry above
#
# storage.custom = ""

# lifetime is in minutes
lifetime = 60

# session cookie name
cookie = "dty_session"

# For storage that needs to do manual clean up. There is a 2 in 200 chances the clean up will be called
lottery = [2, 200]
